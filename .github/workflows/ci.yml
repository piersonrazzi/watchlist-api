name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven # caches ~/.m2 between runs

      # compile -> test -> package (jar + target/bom.json SBOM) -> verify
      - name: Build and test
        run: ./mvnw -B verify

      # Quality gate: fail the build on any CRITICAL finding.
      - name: Dependency vulnerability scan (OSV)
        shell: pwsh
        run: ./scripts/osv-scan.ps1 -Label "CI ${{ github.sha }}" -OutFile osv-report.md -FailOn Critical

      - name: Upload SBOM and scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            target/classes/META-INF/sbom/application.cdx.json
            osv-report.md

  # Builds the production image from the Dockerfile and smoke-tests it:
  # the container must start and answer real HTTP requests.
  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t watchlist-api:ci .

      - name: Smoke test container
        run: |
          docker run -d --name api -p 8080:8080 watchlist-api:ci
          for i in $(seq 1 30); do
            curl -sf localhost:8080/api/watchlists > /dev/null && break
            sleep 2
          done
          echo "--- create a watchlist"
          curl -sf -X POST localhost:8080/api/watchlists \
               -H "Content-Type: application/json" -d '{"name":"ci smoke test"}'
          echo; echo "--- missing id must be a 404 problem+json"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/watchlists/999)" = "404"
          echo "--- container runs as non-root user:"
          docker exec api id -un

      - name: Container logs
        if: always()
        run: docker logs api | tail -20
