spring.application.name=watchlist-api

# In-memory H2 database; the schema is generated from the entities on startup.
spring.datasource.url=jdbc:h2:mem:watchlist;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# Keep database access inside the service layer's transactions.
# (Open-in-view would hold a DB connection for the whole HTTP request.)
spring.jpa.open-in-view=false

# Removed in the Boot 4 migration:
#   spring.jackson.serialization.write-dates-as-timestamps=false
# Jackson 3 moved that setting out of SerializationFeature, so Boot 4 failed to
# start with "No enum constant SerializationFeature.write-dates-as-timestamps".
# Jackson 3 already writes ISO-8601 date strings by default; the controller and
# integration tests assert it.
