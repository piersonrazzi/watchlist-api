spring.application.name=watchlist-api

# In-memory H2 database; the schema is generated from the entities on startup.
spring.datasource.url=jdbc:h2:mem:watchlist;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# Keep database access inside the service layer's transactions.
# (Open-in-view would hold a DB connection for the whole HTTP request.)
spring.jpa.open-in-view=false

# Write dates as ISO-8601 strings ("2026-12-18"), not arrays or timestamps.
spring.jackson.serialization.write-dates-as-timestamps=false
